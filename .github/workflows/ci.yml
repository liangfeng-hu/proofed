name: Proofed CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Python ${{ matrix.python }} conformance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install the public package
        run: python -m pip install --disable-pip-version-check .
      - name: Run kernel and integration tests
        run: python -m unittest discover -s tests -v
      - name: Run independent JavaScript conformance vectors
        run: node verifiers/javascript/check-receipt.mjs spec/test-vectors/vectors.json --vectors

  action-smoke:
    name: Public Action red/green smoke
    runs-on: ubuntu-latest
    needs: conformance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Opt the demo repository into Proofed
        run: |
          python -m pip install --disable-pip-version-check .
          proofed init examples/false-completion
      - name: Re-verify the current demo checkout through the public Action
        uses: ./
        with:
          target: examples/false-completion
      - name: Verify the emitted receipt without importing the kernel
        shell: bash
        run: |
          receipt=$(find examples/false-completion/.proofed/receipts -type f -name 'completion-*.json' | sort | tail -n 1)
          test -n "$receipt"
          python verifiers/python/check_receipt.py "$receipt" --current examples/false-completion
          node verifiers/javascript/check-receipt.mjs "$receipt" --current examples/false-completion
