name: Proofed completion gate
description: Re-verify the current checkout and refuse completion without required evidence.
inputs:
  mode:
    description: Verification mode. v0.1-alpha supports verify-current only.
    required: false
    default: verify-current
  target:
    description: Repository-relative project directory.
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Install the checked-out Proofed action
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Verify the current subject
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PROOFED_MODE: ${{ inputs.mode }}
        PROOFED_TARGET: ${{ inputs.target }}
      run: |
        if [ "$PROOFED_MODE" != "verify-current" ]; then
          echo "Unsupported Proofed mode: $PROOFED_MODE" >&2
          exit 3
        fi
        if [ ! -f "$PROOFED_TARGET/.proofed.yml" ]; then
          echo "Proofed repository opt-in is missing: $PROOFED_TARGET/.proofed.yml" >&2
          exit 3
        fi
        proofed run "$PROOFED_TARGET" --intent "CI required completion check"
        proofed verify "$PROOFED_TARGET" --run-tests --ci
