[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proofed-agent"
version = "0.1.0a3"
description = "A deterministic evidence gate for coding-agent completion claims."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Proofed contributors"}]
keywords = ["agent-skills", "coding-agents", "github-actions", "verification", "attestation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/liangfeng-hu/proofed"
Repository = "https://github.com/liangfeng-hu/proofed"
Issues = "https://github.com/liangfeng-hu/proofed/issues"
Changelog = "https://github.com/liangfeng-hu/proofed/releases"

[project.scripts]
proofed = "proofed.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
