[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofed"
version = "0.1.0a1"
description = "A deterministic evidence gate for coding-agent completion claims."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Proofed contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/liangfeng-hu/proofed"
Repository = "https://github.com/liangfeng-hu/proofed"
Issues = "https://github.com/liangfeng-hu/proofed/issues"

[project.scripts]
proofed = "proofed.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
